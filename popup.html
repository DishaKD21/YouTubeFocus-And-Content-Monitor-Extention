<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusTube</title>
    <style>
      :root {
        --bg: #121212;
        --panel: #1f1f1f;
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #f1f1f1;
        --muted: #b3b3b3;
        --accent: #ff3b30;
        --accent-dark: #d92d2d;
        --toggle-off: #2d2d2d;
        --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
      }

      body {
        width: 340px;
        min-height: 340px;
        height: 360px;
        margin: 0;
        padding: 16px;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .setting {
        background: rgba(31, 31, 31, 0.98);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        padding: 10px 12px 9px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      }

      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 7px;
      }

      .setting-label {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .toggle {
        appearance: none;
        border: none;
        border-radius: 999px;
        padding: 7px 12px;
        min-width: 66px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.04em;
        cursor: pointer;
        background: var(--toggle-off);
        color: var(--text);
        transition: all 0.18s ease;
      }

      .toggle:hover {
        opacity: 0.96;
      }

      .toggle.on {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
        color: #fff;
        box-shadow: 0 8px 18px rgba(255, 59, 48, 0.35);
      }

      .status {
        font-size: 11.5px;
        line-height: 1.45;
        color: var(--muted);
        min-height: 16px;
      }

      .modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.7);
        z-index: 999;
        padding: 12px;
      }

      .modal.visible {
        display: flex;
      }

      .modal-card {
        width: min(280px, 100%);
        max-height: 80vh;
        background: #181818;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        padding: 16px 14px 12px;
        box-shadow: var(--shadow);
      }

      .modal-card h3 {
        margin: 0 0 10px;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
      }

      .modal-card p {
        margin: 0 0 12px;
        text-align: center;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--muted);
      }

      .duration-option,
      .cancel-button {
        width: 100%;
        border: none;
        border-radius: 10px;
        margin-top: 8px;
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        background: #2a2a2a;
        color: var(--text);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .duration-option:hover,
      .cancel-button:hover {
        opacity: 0.96;
        transform: translateY(-1px);
      }

      .duration-option.primary {
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="setting">
        <div class="setting-row">
          <span class="setting-label">Blank Page</span>
          <button type="button" id="blankToggle" class="toggle" aria-pressed="false">OFF</button>
        </div>
        <div id="blankStatus" class="status">Blank Page is currently OFF.</div>
      </div>

      <div class="setting">
        <div class="setting-row">
          <span class="setting-label">Shorts Blocking</span>
          <button type="button" id="shortsToggle" class="toggle" aria-pressed="false">OFF</button>
        </div>
        <div id="shortsStatus" class="status">Shorts Blocking is currently OFF.</div>
      </div>
    </div>

    <div id="durationModal" class="modal" aria-hidden="true">
      <div class="modal-card">
        <h3>Disable Shorts Blocking</h3>
        <p>How long do you want Shorts to stay unblocked?</p>
        <button class="duration-option primary" data-duration="300000">5 Minutes</button>
        <button class="duration-option" data-duration="3600000">1 Hour</button>
        <button class="duration-option" data-duration="manual">Until Manually Enabled</button>
        <button class="cancel-button" id="cancelDuration">Cancel</button>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
